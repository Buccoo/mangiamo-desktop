name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: Release platform (Windows by default; Mac is paused)
        type: choice
        required: true
        default: windows
        options:
          - all
          - windows
          - mac

permissions:
  contents: write

jobs:
  build-windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - name: Checkout mangiamo-desktop
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install desktop dependencies
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --ignore-scripts --allow-same-version

      - name: Test and typecheck desktop
        run: npm test && npm run typecheck

      - name: Build Electron
        run: npm run prepare-config && npm run build:ts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          MANGIAMO_DESKTOP_UPDATE_URL: ${{ vars.DESKTOP_UPDATE_URL }}
          SUSHIAMO_DESKTOP_UPDATE_URL: ${{ vars.DESKTOP_UPDATE_URL }}
          MANGIAMO_DESKTOP_ENABLE_AUTO_UPDATE: "1"
          SUSHIAMO_DESKTOP_ENABLE_AUTO_UPDATE: "1"
          PUBLIC_APP_URL: https://manager.mangiamo.app

      - name: Package Windows
        run: npx electron-builder --win nsis --publish never

      - name: Verify packaged Windows startup and release artifacts
        run: node scripts/desktop/smoke-packaged-app.cjs && node scripts/desktop/verify-release-artifacts.cjs dist-desktop

      - name: Prepare legacy download aliases
        run: |
          Copy-Item -LiteralPath dist-desktop/Mangiamo-Desktop-Setup.exe -Destination dist-desktop/SushiAMO-Desktop-Setup.exe
          Copy-Item -LiteralPath dist-desktop/Mangiamo-Desktop-Setup.exe.blockmap -Destination dist-desktop/SushiAMO-Desktop-Setup.exe.blockmap

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist-desktop/packaged-startup-proof.json
            dist-desktop/*.exe
            dist-desktop/*.yml
            dist-desktop/*.blockmap

  build-mac:
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'mac')
    runs-on: macos-latest
    steps:
      - name: Checkout mangiamo-desktop
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install desktop dependencies
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --ignore-scripts --allow-same-version

      - name: Test and typecheck desktop
        run: npm test && npm run typecheck

      - name: Build Electron
        run: npm run prepare-config && npm run build:ts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          MANGIAMO_DESKTOP_UPDATE_URL: ${{ vars.DESKTOP_UPDATE_URL }}
          SUSHIAMO_DESKTOP_UPDATE_URL: ${{ vars.DESKTOP_UPDATE_URL }}
          MANGIAMO_DESKTOP_ENABLE_AUTO_UPDATE: "1"
          SUSHIAMO_DESKTOP_ENABLE_AUTO_UPDATE: "1"
          PUBLIC_APP_URL: https://manager.mangiamo.app

      - name: Validate Apple notarization credentials
        run: |
          xcrun notarytool store-credentials "electron-builder-notary" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_ID_PASSWORD"
          xcrun notarytool history --keychain-profile "electron-builder-notary" >/dev/null
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD || secrets.APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Package macOS
        run: npx electron-builder --mac dmg --x64 --arm64 --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          # Keep both env names for compatibility across electron-builder / @electron-notarize versions.
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD || secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Prepare legacy download aliases
        run: |
          for ARCH in arm64 x64; do
            cp "dist-desktop/Mangiamo-Desktop-macOS-${ARCH}.dmg" "dist-desktop/SushiAMO-Desktop-macOS-${ARCH}.dmg"
            cp "dist-desktop/Mangiamo-Desktop-macOS-${ARCH}.dmg.blockmap" "dist-desktop/SushiAMO-Desktop-macOS-${ARCH}.dmg.blockmap"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.yml
            dist-desktop/*.blockmap

  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    # Windows can release independently while Mac is paused.
    if: always() && needs.build-windows.result == 'success' && (needs.build-mac.result == 'success' || needs.build-mac.result == 'skipped') && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Require matching packaged startup proof before publication
        run: node scripts/desktop/verify-release-artifacts.cjs artifacts "${{ steps.version.outputs.version }}"

      - name: List artifacts
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: artifacts/**/*
          generate_release_notes: true

  update-feed:
    needs: [release]
    runs-on: ubuntu-latest
    if: always() && needs.release.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          path: mangiamo-desktop

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: mangiamo-desktop/dist-desktop

      - name: Publish coherent updater feed to mangiamo-manager
        env:
          GH_TOKEN: ${{ secrets.SUSHIAMO_PROD_TOKEN }}
          PUBLIC_APP_URL: https://manager.mangiamo.app
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          cd mangiamo-desktop
          npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts --allow-same-version
          cd ..
          gh auth setup-git
          gh repo clone Buccoo/mangiamo-manager repo-clone
          cd repo-clone
          git checkout main
          git fetch origin --prune --tags
          git pull --ff-only
          node ../mangiamo-desktop/scripts/desktop/verify-release-artifacts.cjs ../mangiamo-desktop/dist-desktop "$RELEASE_VERSION"
          node scripts/print/publish-desktop-build.mjs --platform win
          node scripts/print/publish-desktop-updater.mjs
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add public/downloads/latest.yml public/downloads/Mangiamo-Desktop-Setup.exe public/downloads/Mangiamo-Desktop-Setup.exe.blockmap public/downloads/SushiAMO-Desktop-Setup.exe.blockmap public/downloads/printer-updates/windows/latest.json
          git diff --cached --quiet || git commit -m "chore: update desktop latest.yml to ${RELEASE_VERSION}"
          git push
